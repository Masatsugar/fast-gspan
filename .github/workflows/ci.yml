name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test Rust backend
        run: cargo test --locked --manifest-path native/Cargo.toml

      - name: Install package
        run: pip install ".[dev]"

      - name: Run tests against installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -c "from fast_gspan.gbolt_wrapper import _find_vendor_gbolt; assert _find_vendor_gbolt()"
          python -m pytest "$GITHUB_WORKSPACE/tests" -v --import-mode=importlib
